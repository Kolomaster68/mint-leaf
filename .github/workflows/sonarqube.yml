name: MintLeaf Tests, Coverage and SonarQube

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Slather
        run: gem install slather

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run MintLeaf tests with coverage
        run: |
          mkdir -p build

          xcodebuild test \
            -project MintLeaf.xcodeproj \
            -scheme MintLeaf_macOS \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -resultBundlePath build/MintLeafTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Generate SonarQube coverage report
        run: |
          slather coverage \
            --sonarqube-xml \
            --scheme MintLeaf_macOS \
            --output-directory build \
            MintLeaf.xcodeproj

      - name: Display coverage summary
        run: |
          xcrun xccov view \
            --report build/MintLeafTests.xcresult

      - name: Show generated coverage files
        run: |
          find build -maxdepth 2 -type f -name "*.xml" -print

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=cgcazares1_mint-leaf
            -Dsonar.organization=cgcazares1-1
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=MintLeaf
            -Dsonar.tests=MintLeafTests
            -Dsonar.coverageReportPaths=build/sonarqube-generic-coverage.xml
