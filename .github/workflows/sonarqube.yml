name: MintLeaf Tests and Coverage

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Slather
        run: gem install slather

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run MintLeaf tests with coverage
        run: |
          mkdir -p build

          xcodebuild test \
            -project MintLeaf.xcodeproj \
            -scheme MintLeaf_macOS \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -resultBundlePath build/MintLeafTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Generate SonarQube coverage report
        run: |
          slather coverage \
            --sonarqube-xml \
            --scheme MintLeaf_macOS \
            --output-directory build \
            MintLeaf.xcodeproj

      - name: Display coverage summary
        run: |
          xcrun xccov view \
            --report build/MintLeafTests.xcresult
